
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - next_build:/workspace/.next
    working_dir: /workspace
    command: sleep infinity
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: weather_app
      POSTGRES_USER: manik
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manik -d weather_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  node_modules:
  next_build:
  postgres_data:
